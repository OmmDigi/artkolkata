  #     - ./nginx/${NGINX_CONF_FILE_NAME}:/etc/nginx/conf.d/default.conf
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   depends_on:
  #     - c1_frontend_1
  #     - c1_api_1
  #     - c1_upload_api_1
